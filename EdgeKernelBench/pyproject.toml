[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgekernelbench"
version = "0.1.0"
description = "Benchmark and evaluation interfaces for LLM-driven edge kernel generation"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.5", "PyYAML>=6"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[project.urls]
Repository = "https://github.com/pillor9/EdgeKernelBench"
